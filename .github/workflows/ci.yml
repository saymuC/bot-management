name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: better-sqlite3 13 traz binário pré-compilado em
      # prebuilds/ mas não declara install script, então o npm cai no
      # `node-gyp rebuild` por padrão — compilação desnecessária que quebra em
      # qualquer host sem toolchain C++.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
