name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

# O job só lê o repositório. Sem isto o token herda o default do repositório,
# que pode ser read-write.
permissions:
  contents: read

# Push seguido de push não precisa de dois jobs: o antigo já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Com o check obrigatório no ruleset, um job pendurado deixa o PR
    # inmergeável até o limite de 6h do runner. Falha rápido em vez disso.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      # Fail on high/critical findings in the committed lockfile (including dev dependencies).
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm test
      - run: npm run typecheck
